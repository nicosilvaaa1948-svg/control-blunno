<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0757c8">
  <title>Blunno Control Empresarial</title>
  <link rel="icon" href="logo.jpeg">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.jpeg" alt="Distribuidora Blunno">
        <div><b>BLUNNO</b><span>CONTROL EMPRESARIAL</span></div>
      </div>
      <div class="period-card">
        <span>PERÍODO ACTIVO</span>
        <button id="periodSelector" class="period-selector">Septiembre 2026</button>
        <div><i id="periodDot"></i><strong id="periodState">ABIERTO</strong></div>
      </div>
      <nav id="mainNav">
        <button class="nav-item active" data-view="dashboard">⌂ <span>Inicio</span></button>
        <button class="nav-item" data-view="cash">▣ <span>Caja diaria</span></button>
        <button class="nav-item" data-view="providers">◫ <span>Proveedores</span></button>
        <button class="nav-item" data-view="invoices">▤ <span>Facturas</span></button>
        <button class="nav-item" data-view="people">♙ <span>Personal</span></button>
        <button class="nav-item" data-view="hours">◷ <span>Horas · Bodereau</span></button>
        <button class="nav-item" data-view="results">↗ <span>Resultados</span></button>
        <button class="nav-item" data-view="compare">⇄ <span>Comparativas</span></button>
        <button class="nav-item" data-view="history">↺ <span>Historial</span></button>
        <button class="nav-item" data-view="import">⇩ <span>Importar / Exportar</span></button>
      </nav>
      <div class="side-status">
        <span class="status-line"><i id="connectionDot"></i><b id="connectionText">Modo local</b></span>
        <small id="userText">Firebase pendiente</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">DISTRIBUIDORA BLUNNO</div>
          <h1 id="pageTitle">Panel general</h1>
        </div>
        <div class="top-actions">
          <button id="searchBtn" class="icon-button" title="Búsqueda global">⌕</button>
          <button id="newRecordBtn" class="primary-button">＋ Nuevo movimiento</button>
          <button id="accountBtn" class="avatar" title="Cuenta">DB</button>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div><small id="modalKicker"></small><h2 id="modalTitle"></h2></div>
        <button class="close-button" data-close-modal>×</button>
      </div>
      <form id="recordForm">
        <div id="formFields" class="form-grid"></div>
        <div class="modal-footer">
          <button type="button" class="secondary-button" data-close-modal>Cancelar</button>
          <button type="submit" class="primary-button">Guardar y registrar historial</button>
        </div>
      </form>
    </div>
  </div>

  <div id="searchModal" class="modal hidden">
    <div class="modal-card search-card">
      <div class="modal-header">
        <div><small>BÚSQUEDA GLOBAL</small><h2>Encontrar algo en Blunno</h2></div>
        <button class="close-button" data-close-search>×</button>
      </div>
      <input id="searchInput" class="search-input" placeholder="Proveedor, factura, empleado, concepto...">
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="loginModal" class="modal hidden">
    <div class="modal-card login-card">
      <div class="login-brand"><img src="logo.jpeg" alt=""><h2>Acceso Blunno</h2><p>Control Empresarial</p></div>
      <form id="loginForm">
        <label>Correo<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>Contraseña<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <div id="loginMessage" class="form-message"></div>
        <button class="primary-button full-button" type="submit">Ingresar</button>
      </form>
      <button id="logoutButton" class="secondary-button full-button hidden">Cerrar sesión</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
