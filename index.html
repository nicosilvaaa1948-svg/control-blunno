<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Empresarial · Distribuidora Blunno</title>
<link rel="icon" href="assets/logo.jpeg">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><img src="assets/logo.jpeg"><div><strong>BLUNNO</strong><span>CONTROL EMPRESARIAL</span></div></div>
    <div class="period-box"><small>PERÍODO ACTIVO</small><button id="periodBtn" class="period-btn">Septiembre 2026⌄</button><span id="periodStatus">ABIERTO</span></div>
    <nav id="nav">
      <button data-view="dashboard" class="active"><b>⌂</b> Inicio</button>
      <button data-view="cash"><b>▣</b> Caja diaria</button>
      <button data-view="providers"><b>◫</b> Proveedores</button>
      <button data-view="invoices"><b>▤</b> Facturas</button>
      <button data-view="people"><b>♙</b> Personal</button>
      <button data-view="hours"><b>◷</b> Horas · Bodereau</button>
      <button data-view="results"><b>↗</b> Resultados</button>
      <button data-view="compare"><b>⇄</b> Comparativas</button>
      <button data-view="history"><b>↺</b> Historial</button>
      <button data-view="tools"><b>⚙</b> Importar / Exportar</button>
    </nav>
    <div class="sidebar-bottom"><span class="dot"></span><span>Modo de trabajo local</span><small id="firebaseState">Firebase pendiente</small></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">DISTRIBUIDORA BLUNNO</div><h1 id="pageTitle">Panel general</h1></div>
      <div class="top-actions"><button id="globalSearchBtn" class="icon-btn">⌕</button><button id="newBtn" class="primary">＋ Nuevo movimiento</button><div class="avatar">DB</div></div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><div><small id="modalKicker"></small><h2 id="modalTitle"></h2></div><button id="modalClose">×</button></div><form id="modalForm"><div id="modalFields" class="form-grid"></div><div class="modal-foot"><button type="button" class="ghost" id="modalCancel">Cancelar</button><button class="primary" type="submit">Guardar cambios</button></div></form></div></div>
<div id="searchModal" class="modal hidden"><div class="modal-card search-card"><div class="modal-head"><div><small>BÚSQUEDA GLOBAL</small><h2>Encontrar algo en Blunno</h2></div><button id="searchClose">×</button></div><input id="searchInput" class="search-input" placeholder="Proveedor, factura, empleado, movimiento…"><div id="searchResults" class="search-results"></div></div></div>
<script type="module" src="js/app.js"></script>
</body></html>
